openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: roles
    description: Roles and assignments
  - name: grants
    description: Access grants (permissions)
  - name: apps
    description: Applications and resources
  - name: security
    description: Security policies
  - name: audit
    description: Audit log
  - name: sync
    description: Data sync error log
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /summary:
    get:
      operationId: getSummary
      tags: [audit]
      summary: Dashboard summary counts
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users with their roles
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (name, email, status)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List all roles with user counts
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a new role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          description: Invalid input or duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /role-assignments/bulk:
    post:
      operationId: bulkCreateRoleAssignments
      tags: [roles]
      summary: Assign one or more roles to one or more users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRoleAssignmentInput"
      responses:
        "200":
          description: Bulk assignment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkRoleAssignmentResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /role-assignments:
    get:
      operationId: listRoleAssignments
      tags: [roles]
      summary: List user-role assignments
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleAssignment"
    post:
      operationId: createRoleAssignment
      tags: [roles]
      summary: Assign a role to a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400":
          description: Invalid or duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /role-assignments/{id}:
    delete:
      operationId: deleteRoleAssignment
      tags: [roles]
      summary: Remove a role from a user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: List managed applications
      responses:
        "200":
          description: Apps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/App"
  /resources:
    get:
      operationId: listResources
      tags: [apps]
      summary: List resources (forms, tabs, tables), optionally by app
      parameters:
        - name: appId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
  /access-grants:
    get:
      operationId: listAccessGrants
      tags: [grants]
      summary: List access grants, optionally filtered by app or role
      parameters:
        - name: appId
          in: query
          required: false
          schema: { type: integer }
        - name: roleId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessGrant"
    post:
      operationId: createAccessGrant
      tags: [grants]
      summary: Grant a role access to a resource at a permission level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessGrantInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGrant"
        "400":
          description: Invalid or duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /access-grants/{id}:
    patch:
      operationId: updateAccessGrant
      tags: [grants]
      summary: Change the permission level of a grant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessGrantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGrant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteAccessGrant
      tags: [grants]
      summary: Revoke a grant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /security-policies:
    get:
      operationId: listSecurityPolicies
      tags: [security]
      summary: List security policies per app
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityPolicy"
  /security-policies/{id}:
    patch:
      operationId: updateSecurityPolicy
      tags: [security]
      summary: Update an app's security policy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityPolicyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityPolicy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      summary: List audit log entries, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
  /sync/error-log:
    get:
      operationId: listSyncErrors
      tags: [sync]
      summary: List data sync errors, unique per entity and record id, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: entity
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Sync errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncErrorList"
  /sync/entities:
    get:
      operationId: listSyncEntities
      tags: [sync]
      summary: List entities that have sync errors, with unique error counts
      responses:
        "200":
          description: Entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncEntityCount"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SyncErrorEntry:
      type: object
      required: [id, entitySetName, recordId, operation, errorMessage, createdOn]
      properties:
        id: { type: integer }
        entitySetName: { type: string }
        recordId: { type: string, nullable: true }
        operation: { type: string }
        errorMessage: { type: string }
        createdOn: { type: string, nullable: true }
    SyncEntityCount:
      type: object
      required: [entitySetName, uniqueErrors]
      properties:
        entitySetName: { type: string }
        uniqueErrors: { type: integer }
    SyncErrorList:
      type: object
      required: [entries, totalUnique]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SyncErrorEntry"
        totalUnique: { type: integer }
    PermissionLevel:
      type: string
      enum: ["Full Rights", "Read & Write", "View"]
    Summary:
      type: object
      required: [users, activeUsers, roles, apps, resources, grants, assignments, auditEntries]
      properties:
        users: { type: integer }
        activeUsers: { type: integer }
        roles: { type: integer }
        apps: { type: integer }
        resources: { type: integer }
        grants: { type: integer }
        assignments: { type: integer }
        auditEntries: { type: integer }
    User:
      type: object
      required: [id, name, email, status, roles, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, disabled] }
        roles:
          type: array
          items:
            type: object
            required: [assignmentId, roleId, roleName]
            properties:
              assignmentId: { type: integer }
              roleId: { type: integer }
              roleName: { type: string }
        createdAt: { type: string }
    UserInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        status: { type: string, enum: [active, disabled] }
        roleIds:
          type: array
          items: { type: integer }
    UserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        status: { type: string, enum: [active, disabled] }
    Role:
      type: object
      required: [id, name, description, userCount, grantCount]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        userCount: { type: integer }
        grantCount: { type: integer }
    CreateRoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    BulkRoleAssignmentInput:
      type: object
      required: [userIds, roleIds]
      properties:
        userIds:
          type: array
          items: { type: integer }
          minItems: 1
        roleIds:
          type: array
          items: { type: integer }
          minItems: 1
    BulkRoleAssignmentResult:
      type: object
      required: [created, skipped]
      properties:
        created: { type: integer }
        skipped: { type: integer }
    RoleAssignment:
      type: object
      required: [id, userId, userName, roleId, roleName, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        userName: { type: string }
        roleId: { type: integer }
        roleName: { type: string }
        createdAt: { type: string }
    RoleAssignmentInput:
      type: object
      required: [userId, roleId]
      properties:
        userId: { type: integer }
        roleId: { type: integer }
    App:
      type: object
      required: [id, name, resourceCount]
      properties:
        id: { type: integer }
        name: { type: string }
        resourceCount: { type: integer }
    Resource:
      type: object
      required: [id, appId, appName, name, type, description]
      properties:
        id: { type: integer }
        appId: { type: integer }
        appName: { type: string }
        name: { type: string }
        type: { type: string, enum: [Form, Tab, Table] }
        description: { type: string }
    AccessGrant:
      type: object
      required: [id, roleId, roleName, resourceId, resourceName, resourceType, appId, appName, level]
      properties:
        id: { type: integer }
        roleId: { type: integer }
        roleName: { type: string }
        resourceId: { type: integer }
        resourceName: { type: string }
        resourceType: { type: string }
        appId: { type: integer }
        appName: { type: string }
        level:
          $ref: "#/components/schemas/PermissionLevel"
    AccessGrantInput:
      type: object
      required: [roleId, resourceId, level]
      properties:
        roleId: { type: integer }
        resourceId: { type: integer }
        level:
          $ref: "#/components/schemas/PermissionLevel"
    AccessGrantUpdate:
      type: object
      required: [level]
      properties:
        level:
          $ref: "#/components/schemas/PermissionLevel"
    SecurityPolicy:
      type: object
      required: [id, appId, appName, authMethod, mfaRequired, sessionTimeoutMinutes, recordLevelScope, fieldLevelRules, auditLogging, dataExportPolicy]
      properties:
        id: { type: integer }
        appId: { type: integer }
        appName: { type: string }
        authMethod: { type: string }
        mfaRequired: { type: string }
        sessionTimeoutMinutes: { type: integer }
        recordLevelScope: { type: string }
        fieldLevelRules: { type: string }
        auditLogging: { type: boolean }
        dataExportPolicy: { type: string }
    SecurityPolicyUpdate:
      type: object
      properties:
        authMethod: { type: string }
        mfaRequired: { type: string }
        sessionTimeoutMinutes: { type: integer }
        recordLevelScope: { type: string }
        fieldLevelRules: { type: string }
        auditLogging: { type: boolean }
        dataExportPolicy: { type: string }
    AuditEntry:
      type: object
      required: [id, action, entity, detail, actor, createdAt]
      properties:
        id: { type: integer }
        action: { type: string }
        entity: { type: string }
        detail: { type: string }
        actor: { type: string }
        createdAt: { type: string }
