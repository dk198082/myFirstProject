          type: string
        itemid:
          type: string
          nullable: true
        itemname:
          type: string
          nullable: true
        productconfiguration:
          type: string
          nullable: true
          description: Product configuration id for the produced item (D365 productconfigurationid).
        schedulefromdate:
          type: string
          nullable: true
        scheduledenddate:
          type: string
          nullable: true
        prodqty:
          type: number
          nullable: true
        productionstatus:
          type: integer
          nullable: true
          description: "D365FO numeric status: 0=Created,1=Estimated,2=Scheduled,3=Released,4=Started,5=ReportedAsFinished,6=Ended,7=Ordered"
        demandsalesordernumber:
          type: string
          nullable: true
        demandproductionordernumber:
          type: string
          nullable: true
          description: Reference number of the parent/linked production order (D365 demandproductionordernumber). Populated when this order was created to satisfy a parent work order.
        syncstartdatetime:
          type: string
          nullable: true
          description: Timestamp when D365 last synced this record to the PostgreSQL staging mirror.
        productionpool:
          type: string
          nullable: true
          description: Production pool id (D365 productionpoolid) the order belongs to.
        resourcecode:
          type: string
          nullable: true
          description: Work center / operations resource ID from capacity reservation. Null = unscheduled.
        resourcename:
          type: string
          nullable: true
          description: Display name of the resource from opres table. Often blank for machine/work-center resources.
        workername:
          type: string
          nullable: true
          description: "Assigned worker name(s) for the order, aggregated from route transactions joined to hcmworkerstaging. Multiple workers separated by '; '."
        totalscheduledtime:
          type: number
          nullable: true
          description: Total scheduled time (hours) for the order, summed from estimated setup + process time across route operations.
        consumedhours:
          type: number
          nullable: true
          description: Hours actually posted/registered so far across non-warehouse route operations. Compare against totalscheduledtime for % of duration consumed.
        expectedconsumedhours:
          type: number
          nullable: true
          description: >
            Hours that SHOULD be posted by now if totalscheduledtime were spread
            evenly across the Mon–Fri working days of the production window
            (route start/end excluding warehouse bookend operations). 0 before
            the window starts, equal to totalscheduledtime after it ends; the
            current day counts proportionally by time of day. Null when the
            window or total is unavailable.
        salescustomeraccount:
          type: string
          nullable: true
        customername:
          type: string
          nullable: true
        confirmedshipdate:
          type: string
          nullable: true
        groupsyncpending:
          type: boolean
          nullable: true
          description: True while the order's production-group change has been written to D365 but the staging mirror hasn't reflected it yet (local override active). UI shows a sync indicator.
      required:
        - prodid
        - dataareaid
        - productiongroupid

